<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover for env(safe-area-inset-*); pinch zoom is never
         disabled, at any width (§10.3). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Launder WM</title>

    <!--
      ============================================================
      DOCUMENT METADATA — and why none of it lives in copy.toml
      ============================================================
      §10.7 says every PLAYER-FACING string lives in data/config/copy.toml, and
      web/tests/boot.test.ts fails if the fixture below drifts from that file.
      The head is the one place that rule does not reach, and the reasoning is
      written down here rather than left to be re-derived:

        1. THE MECHANISM CANNOT REACH A <meta>. copy.toml arrives in the boot
           payload and is applied by main.ts through [data-copy] /
           [data-copy-aria], i.e. by setting textContent and aria-label on
           elements AFTER JS runs. A crawler or a link unfurler reads the head
           and leaves; it never runs main.ts. A `data-copy` on a <meta> would be
           filled long after the only reader had gone.
        2. THE ALTERNATIVE IS A SECOND COPY IN THE SAME DOCUMENT. Putting the
           description in copy.toml would mean boot.py substituting it into the
           head — while the identical sentence also ships, verbatim, inside the
           #launder-boot JSON on the same page, because the whole copy tree is
           inlined. One string, two places, one document.
        3. <title> ALREADY WORKS THIS WAY. "Launder WM" has been static here
           since M0 and copy.toml has never owned it. og:title and og:site_name
           are the same document identity restated for a different reader, so
           they follow the string that is already static rather than inventing
           a second home for the product's name.
        4. NOTHING BELOW IS RENDERED IN THE PRODUCT. It is never on screen for
           a player, so it is not the playtesting surface copy.toml exists to
           make editable without a code change.

      The consequence is that these strings sit outside `forge lint-copy`, so
      the COPY STANDARD is enforced on them by web/tests/boot.test.ts instead:
      the description may not say "human", may not print a "%" figure, and may
      not call the watermark "secure" (copy.toml's rule 2, §14.4). "A real
      detector" is the one claim the project does authorise — the key is
      published, which makes the detector real, not secure — and the
      description stops there. It does not say what wrote the text and it does
      not put a number on it.

      DELIBERATELY ABSENT, so nobody adds them back by reflex:
        - og:image. Every unfurler (Facebook, X, Slack, iMessage) fetches the
          image over the network and decodes it as PNG/JPEG/GIF/WEBP. An SVG is
          not accepted and a data: URI is not fetchable, so the only way to
          have one is a checked-in binary, which this repo does not want. A
          card with a title and a description and no image is a correct card;
          an og:image pointing at something no crawler can read is a broken one.
        - twitter:title / twitter:description. X falls back to og:* for both.
          Restating them is two more strings that can drift from the two above.
        - apple-touch-icon. See the icon block below: iOS requires a PNG.
    -->
    <meta
      name="description"
      content="A browser game about AI text watermarks. Change words in a watermarked passage until a real detector stops finding the watermark."
    />

    <!--
      og:url and canonical are RELATIVE ON PURPOSE, and launder-serve rewrites
      them to the origin the request actually arrived on (boot.py's
      `render_origin`, a fifth rewritten region).

      A hardcoded https://launder.sshh.io here is the mistake copy.toml already
      names around `share_all_template`: "hardcoding a domain here would post
      the wrong link from every preview deploy and from localhost". A Railway
      preview that unfurls as production is worse than one that unfurls as
      itself, because the link in the post goes somewhere other than the thing
      being discussed.

      "/" is the honest un-rendered value: it resolves against the document, so
      even a page served straight off the static mount points at its own
      origin. canonical accepts a relative URL by spec; og:url does not, which
      is exactly why the server rewrite exists. Both name the ROOT rather than
      the current URL because `?level=` and the `launder_level` cookie select a
      level of one document — a share of level 7 should still send people to
      the game, not to a level they have not unlocked.

      `vite-ignore` IS LOAD-BEARING, and the first version without it did not
      build at all. Vite treats `href` on EVERY <link> as an asset reference:
      a data: URI and an absolute URL are skipped, but `/` is read as a public
      path, resolved to `web/`, and handed to readFile — which fails the build
      with `EISDIR: illegal operation on a directory`. `vite-ignore` is the
      documented opt-out; it makes vite skip the node and strip the attribute
      itself from dist/index.html, so the tag that ships is the tag written
      here. The og:url <meta> beside it needs nothing: vite only inspects
      `content` on the og:image/og:video/og:audio family.
    -->
    <link rel="canonical" href="/" vite-ignore />
    <meta property="og:url" content="/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Launder WM" />
    <meta property="og:title" content="Launder WM" />
    <meta
      property="og:description"
      content="A browser game about AI text watermarks. Change words in a watermarked passage until a real detector stops finding the watermark."
    />
    <!-- No image, so `summary` rather than `summary_large_image`: the large
         card reserves space for a picture and renders the gap when none
         arrives. -->
    <meta name="twitter:card" content="summary" />

    <!-- --bg, both modes, straight from src/styles/tokens.css. The browser
         paints its own chrome with this before any CSS loads, so a value that
         drifts from the token shows up as a seam between the address bar and
         the page. boot.test.ts reads tokens.css and asserts the two match. -->
    <meta name="theme-color" content="#e9e7e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />

    <!--
      ============================================================
      THE ICON — the wash basin, redrawn for 16px
      ============================================================
      Inline, as a data: URI. Three reasons it is not a file:
        - vite.config.ts sets `publicDir: false`, so web/public is not copied
          into dist at all; a file there would simply not ship.
        - no request. With no <link rel="icon"> at all the browser goes and
          asks for /favicon.ico on every cold visit, which on this server falls
          through the API routes to the static mount and 404s. A declared icon
          removes that round trip instead of answering it.
        - no binary asset, no PNG pipeline, no CDN.

      THE GEOMETRY. It is the `wash` glyph from src/game/gate.ts — the game's
      verb is "wash it out", and the basin is already the product's central
      image — but it is NOT that path. Pasting the 24px in-app path here would
      produce grey mush at 16px, for two measurable reasons:

        - STROKE. The in-app symbols are 1.35 units on a 24 grid. Rendered into
          a 16px box that is 1.35 * 16/24 = 0.9 DEVICE PIXELS, i.e. below one
          pixel, so every line antialiases to a soft grey smear. This icon uses
          2.2 units = 1.47px at 16, and 2.9px at the 32px size browsers ask for
          on a retina tab strip. 1.63x the in-app weight.
        - DETAIL. `wash` is three parts: the basin, a five-node wave with three
          bumps, and the arc over the rim. At 16px each bump of that wave is
          1.6px wide and reads as a straight bar, and the arc sits ~4.8 units
          off the rim, which at a 2.2 stroke leaves under a device pixel of gap
          — the two merge into one thick smudge. So the arc is DROPPED and the
          wave is reduced from three bumps to one full period.

      What survives is the two irreducible ideas: the vessel and the water. At
      16px it reads as a basin with a line in it, which is already
      unmistakable; the wave resolves as a wave from 32px up. Every clearance
      in the drawing was solved for the 16px case: 2.0 units (1.35px) between
      the wave and the rim above it, 1.9 (1.27px) to the basin floor below it,
      and 2.0 to each wall — which is why the wave spans only x 7.6..16.4
      rather than the full interior.

      COLOUR. --ink from tokens.css, both modes, via a media query INSIDE the
      SVG. `stroke="currentColor"` — what the in-app symbols use — is wrong
      here: a favicon is its own document with no cascade from the page, so
      currentColor resolves to the initial black and disappears against dark
      browser chrome. The presentation attribute carries the light value and
      the @media rule overrides it, so a browser that renders SVG icons but
      ignores the query still gets the readable-on-white ink rather than
      nothing. Both values are tokens; no new colour is introduced.

      NO apple-touch-icon. It would have to be this same data: URI, and iOS
      does not accept SVG for it — Safari requires a PNG and silently falls
      back to a screenshot of the page when it cannot decode one, which is a
      worse home-screen tile than the default. It is not omitted for lack of
      trying; it cannot be done without the binary asset this file is refusing.

      Decoded, the URI below is exactly:

        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'
             fill='none' stroke='#1b1a17' stroke-width='2.2'
             stroke-linecap='round' stroke-linejoin='round'>
          <style>@media(prefers-color-scheme:dark){svg{stroke:#dcddd7}}</style>
          <path d='M2.4 5.6h19.2l-1.6 11a2.5 2.5 0 0 1-2.5 2.2H6.5a2.5 2.5 0 0 1-2.5-2.2Z'/>
          <path d='M7.6 12.3c1.5-2 2.9-2 4.4 0s2.9 2 4.4 0'/>
        </svg>
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231b1a17' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3E@media(prefers-color-scheme:dark){svg{stroke:%23dcddd7}}%3C/style%3E%3Cpath d='M2.4 5.6h19.2l-1.6 11a2.5 2.5 0 0 1-2.5 2.2H6.5a2.5 2.5 0 0 1-2.5-2.2Z'/%3E%3Cpath d='M7.6 12.3c1.5-2 2.9-2 4.4 0s2.9 2 4.4 0'/%3E%3C/svg%3E"
    />

    <script type="module" src="/src/main.ts"></script>

    <!--
      ============================================================
      SERVER TEMPLATE CONTRACT — launder_serve
      ============================================================
      This file is the level page: `GET /` picks which level to render from
      `?level=`, then the `launder_level` cookie, then 1. launder-serve
      rewrites exactly five regions, each delimited by a comment pair or
      named below, and nothing else:

        1. LAUNDER:BOOT   the JSON payload below — the level, the detector
                          expectation, the pristine reading, the primer's
                          GENERATED demo, the intro's prefix_z, and
                          data/config/copy.toml rendered to JSON. Escape
                          `<` as <.
        2. LAUNDER:TEXT   the passage, inside the textarea element.
                          HTML-escape ampersand and less-than. THE FIRST
                          CHARACTER MUST FOLLOW THE START TAG IMMEDIATELY: an
                          HTML parser eats one newline directly after the
                          start tag, and the player would silently begin from
                          a different string than the one the server scored.
        3. #face style    --init-x (the needle's position as a PERCENTAGE of
                          the face) and --init-n (0..1 fill), so the instrument
                          reads the passage's expected_z before any network
                          call and before any JS (§5.4 step 1). A percentage
                          because the face's width is layout-dependent and the
                          server cannot know it: the only px offset it could
                          honestly write was 0, i.e. a needle pinned to the
                          left edge for the whole pre-JS frame.
        4. #num text      the same expected_z as 0-100 POINTS (the needle's
                          only displayed number; z stays internal), and
                          #stateword's data-copy flipped to readout.below
                          when the passage already sits under z*.
        5. og:url and     the "/" above, rewritten to the ORIGIN this request
           canonical      arrived on. Unlike the four above it is applied per
                          request rather than per level, because it is the one
                          thing on the page that varies by host and the render
                          cache must not be keyed on an attacker-supplied
                          header. See boot.py's `render_origin`.

      Everything else is filled from the boot payload by main.ts:
      [data-copy] sets textContent, [data-copy-aria] sets aria-label, and
      [data-copy-opt] does the same but REMOVES the element when the key is
      absent — no player-facing string is ever written in TypeScript
      (§10.7).

      The checked-in values are the dev fixture: the real passage from
      data/dev/passage.txt and the real strings from data/config/copy.toml,
      with dev:true, no reading and expected_z 0 — because a reading is a
      detector output and this repo will not ship an invented one.
      It is "level 1 of 1" because that is the ONLY campaign dev:true can
      describe: `dev` is set exactly when data/passages/ is empty and
      data/dev/passage.txt stands in as the whole campaign. A fixture claiming
      dev:true alongside a fifteen-level campaign is a page the server can
      never render, and a fixture nobody can reproduce is a fixture nobody can
      debug against. web/tests/boot.test.ts fails if the inlined copy drifts
      from data/config/copy.toml.
    -->
    <!-- LAUNDER:BOOT -->
    <script type="application/json" id="launder-boot">
{
"schema": "launder.boot/2",
"dev": true,
"level_n": 1,
"level_count": 1,
"passage_id": "p_dev",

{

},
"par": 4,
"asset_bundle_id": "",
"wm_config_id": "",
"detector": {

}
},
"reading": null,
"primer_demo": null,
"intro": null,
"assets": null,
"copy": {
"primer": {
"lede_1": "This text is watermarked.",
"body_1": "Watermarking makes language models choose words in a secret pattern. The text reads normally, but a detector that knows the pattern can find it.",
"demo": "The committee met on Thursday to consider whether the proposal deserved another year of funding.",
"lede_2": "Your job: wash it out.",
"body_2": "Move the needle below the line. Use as few word changes as you can. The text must still read well and mean the same.",
"open_label": "What is this?",
"close_label": "Start"
},
"readout": {
"above": "AI watermark detected",
"below": "Not detected",
"threshold_label": "Under {z_star_display} to clear",
"meter_name": "Watermark evidence",
"valuetext_above": "{z_display}, above the line",
"valuetext_below": "{z_display}, below the line",
"distance_label": "{distance} changed",
"distance_zero": "nothing changed",
"cleared_toast": "Cleared in {distance}",
"provisional_note": "Gate unavailable — this one does not count.",
"share_template": "Launder WM — level {level_n} cleared in {distance} 🧼",
"share_all_template": "Launder WM 🧼\nCleared all {level_count} levels — {total} words changed\n{per_level}\n{url}"
},
"screen": {

"next_label": "Next level",

},
"check": {
"unicode_sanitation": {
"label": "Real characters",
"blurb": "Every character has to be one a reader can see. Invisible spacers, hidden joiners, and letters from other alphabets that look like English ones do not count as edits — they change what the detector reads without changing what you read. Paste from a word processor and a few can arrive without you noticing.",
"reject": "This does not read like a person wrote it — {count} invisible or lookalike characters were added.",

},
"word_floor": {

"reject": "Too short: {n_words} words, and this level needs {min_words}."
},

"reject": "You changed {distance} words. This level allows {max_word_distance}."
},

},

},

},

},

}
</script>
    <!-- /LAUNDER:BOOT -->
  </head>

  <body class="page" data-screen="play" data-typing="0" data-cleared="0">
    <main class="app" id="app">
      <!-- ============ the instrument: read, never touched (§10.5) ============ -->
      <div class="rail" id="rail">
        <div class="notice" id="notice" hidden>
          <span class="ndot"></span><span id="noticetxt"></span>
        </div>

        <div class="railhead">
          <span class="levelno" id="levelno"></span>
          <button class="whatbtn" id="whatbtn" type="button" data-copy-aria="primer.open_label">
            ?
          </button>
          <span class="lvlchip" id="lvlchip"><span class="lvlname" id="lvlname"></span></span>
          <div class="readout">
            <span class="num" id="num" data-pending="1">17</span>
            <span class="stateword" id="stateword" data-copy="readout.above"></span>
          </div>
        </div>

        <!-- The meter speaks in points, so its bounds are 0..100. z is the
             statistic and stays internal; a scale printed -2..10 reads as a
             broken instrument, and a spoken "-2" is worse. -->
        <div
          class="meter"
          id="meter"
          role="meter"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="17"
          data-copy-aria="readout.meter_name"
        >
          <div class="face" id="face" style="--init-x: 16.6667%; --init-n: 0.1667">
            <div class="fill" id="fill"></div>
            <div class="notch" id="notch"></div>
            <div class="sweep" id="sweep"></div>
            <div class="peak" id="peak" data-snap="1"></div>
            <div class="needle" id="needle"></div>
          </div>
          <!-- The threshold's gutter sits between the face and the printed
               numerals, because the pointer and "Under 36 to clear" name the
               NOTCH: below the 0..100 row they were a register away from the
               mark they refer to. -->
          <div class="gutrow">
            <div class="tri" id="tri"></div>
            <div class="floorlbl" id="floorlbl"></div>
          </div>
          <div class="scalerow" id="scalerow"></div>
        </div>
      </div>

      <p class="sr" id="live" aria-live="polite"></p>

      <div class="stage">
        <div>
          <!-- ============ intro: the length slider (§10.1) ============ -->
          <div class="introwrap" id="introwrap" hidden>
            <p class="introline" id="introline"></p>
            <div class="passage" id="passageIntro">
              <div class="mirror" id="mirrorIntro" data-visible="1"></div>
            </div>
            <div class="sliderwrap">
              <input class="slider" id="slider" type="range" min="1" max="2" value="1" />
              <div class="slidescale" id="slidescale"></div>
              <div class="wordcount" id="wordcount"></div>
            </div>
            <div class="actions">
              <button class="btn" id="begin" type="button"></button>
            </div>
          </div>

          <!-- ============ play ============ -->
          <div class="playwrap" id="playwrap">
            <!--
              Variant 1 (§10.3): the mirror is IN FLOW and defines the height;
              the textarea is absolutely positioned and stretched to it. They
              cannot disagree, because only one of them has an opinion.
              autocorrect / autocapitalize / spellcheck are off because smart
              quotes, em-dash substitution and auto-capitalisation silently
              change tokenisation — therefore g-values, therefore the needle
              and the score — WITHOUT the player doing anything. The cost is
              the QuickType bar on some iOS versions; determinism wins in a
              scoring game, and we mention it nowhere in the UI.
            -->
            <div class="passage" id="passage" data-kind="prose">
              <div class="mirror" id="mirror" aria-hidden="true" data-heat="pending"></div>
              <!-- LAUNDER:TEXT --><textarea
                class="raw"
                id="raw"
                autocorrect="off"
                autocapitalize="off"
                autocomplete="off"
                spellcheck="false"
                enterkeyhint="enter"
                inputmode="text"
                aria-labelledby="lvlchip"
                data-copy-aria-opt="screen.passage_label"
              >The committee's report, released late Tuesday, argues that the current framework for evaluating municipal infrastructure grants has drifted well beyond its original purpose. What began as a narrow mechanism for distributing federal repair funds to distressed counties has, over fifteen years, accumulated a thicket of eligibility criteria that few applicants can navigate without professional assistance. The authors note, with some understatement, that the median application now runs to four hundred pages. They recommend consolidating the seven existing programs into two, and shifting the burden of demonstrating need from the applicant to the administering agency, which already holds most of the relevant data. Critics of the proposal argue that such consolidation would strip away protections for the smallest jurisdictions, whose circumstances rarely fit standard templates. The committee acknowledges the concern but contends that the status quo already fails those communities, simply less visibly.</textarea
              ><!-- /LAUNDER:TEXT -->
            </div>

            <div class="status">
              <button class="pips" id="pips" type="button"></button>
              <span class="parline" id="parline"></span>
              <span class="changed" id="changed"></span>
            </div>

            <!-- keyboard-open compaction: the status row folds into the sticky
                 submit bar as a strip beside a compact CHECK, so the way to
                 finish stays on screen while the keyboard is up -->
            <div class="actions" id="actions">
              <div class="strip" id="strip">
                <span class="changed" id="stripcount"></span>
                <button class="pips" id="pipsStrip" type="button"></button>
              </div>
              <button class="btn" id="check" type="button" data-copy="screen.action"></button>
            </div>
          </div>
        </div>

        <!-- desktop rail, >= 56.25em only -->
        <aside class="side">
          <div class="lbl" data-copy="gate.checklist_title"></div>
          <div class="checks" id="sidechecks"></div>
        </aside>
      </div>

      <!-- The credit line. Two real links, both filled from copy.toml and both
           `rel="noopener"`, because `target="_blank"` without it hands the new
           tab a window.opener handle back into this document. -->
      <div class="foot">
        <a
          class="credit"
          href="https://x.com/ShrivuShankar"
          target="_blank"
          rel="noopener"
          data-copy="screen.credit"
        ></a>
        <span class="footsep" aria-hidden="true">·</span>
        <a
          class="credit"
          href="https://github.com/sshh12/launder-wm"
          target="_blank"
          rel="noopener"
          data-copy="screen.source"
        ></a>
      </div>
    </main>

    <div class="scrim" id="scrim" data-open="0"></div>

    <!-- ============ the primer: once on first land, then only from ? ======= -->
    <div
      class="sheet"
      id="primersheet"
      data-open="0"
      role="dialog"
      aria-modal="true"
      aria-labelledby="prt"
    >
      <div class="sheetin">
        <div class="sheethead">
          <span class="sheettitle" id="prt">Launder WM</span>
          <button class="x" type="button" data-close data-copy-aria-opt="screen.close_label">
            ×
          </button>
        </div>

        <p class="pr-lede" data-copy="primer.lede_1"></p>
        <p class="pr-body" data-copy="primer.body_1"></p>

        <!-- The stain is GENERATED by the production detector over the real
             key. With no reading in the boot payload this renders unstained
             rather than inventing one (§10.7). -->
        <div class="pr-demo"><div class="mirror" id="mirrorPrimer" data-visible="1"></div></div>

        <p class="pr-lede" data-copy="primer.lede_2"></p>
        <p class="pr-body" data-copy="primer.body_2"></p>

        <div class="pr-foot">
          <button class="btn" id="prplay" type="button" data-copy="primer.close_label"></button>
        </div>
      </div>
    </div>

    <!-- ============ gate outcome: a sheet, never a toast (§10.5) =========== -->
    <div
      class="sheet"
      id="gatesheet"
      data-open="0"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gv"
    >
      <div class="sheetin">
        <div class="sheethead">
          <span class="sheettitle" data-copy="gate.checklist_title"></span>
          <button class="x" type="button" data-close data-copy-aria-opt="screen.close_label">
            ×
          </button>
        </div>
        <div class="verdict" id="gv" data-v="fail"></div>
        <p class="reason" id="greason"></p>
        <p class="note" id="gnote" hidden></p>
        <div class="checks" id="gatechecks"></div>
      </div>
    </div>

    <!-- ============ this level's rules ==================================== -->
    <div
      class="sheet"
      id="checksheet"
      data-open="0"
      role="dialog"
      aria-modal="true"
      aria-labelledby="cst"
    >
      <div class="sheetin">
        <div class="sheethead">
          <span class="sheettitle" id="cst" data-copy="gate.checklist_title"></span>
          <button class="x" type="button" data-close data-copy-aria-opt="screen.close_label">
            ×
          </button>
        </div>
        <div class="lbl" id="checkhint"></div>
        <div class="checks" id="listchecks"></div>
      </div>
    </div>

    <!-- ============ the result: a sewn-in care label ====================== -->
    <div
      class="sheet"
      data-size="full"
      id="resultsheet"
      data-open="0"
      role="dialog"
      aria-modal="true"
      aria-labelledby="rtop"
    >
      <div class="sheetin">
        <div class="sheethead">
          <span class="sheettitle" id="rt"></span>
          <button class="x" type="button" data-close data-copy-aria-opt="screen.close_label">
            ×
          </button>
        </div>
        <div class="label">
          <div class="label-top" id="rtop"></div>
          <div class="label-big" id="rbig"></div>
          <div class="label-sub" id="rsub"></div>
          <div class="label-syms" id="rsyms"></div>
        </div>
        <!-- A PROVISIONAL clear: the gate could not run its meaning half (the
             judge was unreachable, or the day's spend cap was hit), so this one
             does not count and the campaign does not advance. It had no home on
             this sheet at all — the note existed only on #gatesheet, where
             `provisional` is unreachable because run_gate sets it False on every
             rejection. So the one outcome where it CAN be true rendered as an
             ordinary clear, the client silently skipped markCleared and the
             cookie, and the player found the level uncleared on their next visit
             with nothing on screen having said why. -->
        <p class="gnote" id="rnote" hidden></p>
        <div class="lbl" data-copy-opt="screen.diff_label"></div>
        <div class="diff" id="rdiff"></div>
        <div class="sharebox" id="rshare"></div>
        <!-- On the last level #nextlvl has nowhere to go: it is hidden and this
             takes its place, above the same share box, which by then holds the
             whole campaign instead of one level. -->
        <p class="allclear" id="rallclear" hidden data-copy="screen.all_clear"></p>
        <div class="actions" id="ractions">
          <button class="btn" id="nextlvl" type="button" data-copy="screen.next_label"></button>
          <button class="btn" id="copyres" type="button" data-copy-opt="screen.copy_label"></button>
        </div>
      </div>
    </div>
  </body>
</html>
