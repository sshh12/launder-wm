# alembic.ini — TECH_PLAN.md §9.8
#
# Migrations run as Railway's preDeployCommand, between build and deploy,
# inside the private network, from the built image. A non-zero exit BLOCKS THE
# DEPLOYMENT and is not retried.
#
# Two rules that follow from overlapSeconds (old and new code serve
# simultaneously):
#   1. EXPAND/CONTRACT ONLY. Add nullable columns and new tables in one deploy;
#      backfill; drop or set NOT NULL in a later one. Never DROP COLUMN in the
#      release that stops writing it.
#   2. NEVER `alembic downgrade` in production. Railway rollback restores the
#      old IMAGE, not the old schema. Forward-fix.
#
# sqlalchemy.url is deliberately EMPTY. alembic/env.py reads DATABASE_URL from
# the environment (Railway supplies ${{Postgres.DATABASE_URL}} verbatim; psycopg3
# accepts its query params as-is, which is why we are not on asyncpg). A URL
# pasted here would be a credential in git and would silently win over the env.

[alembic]
script_location = alembic
prepend_sys_path = packages/core/src:packages/serve/src
path_separator = os

# Timestamped, sortable revision filenames so `ls alembic/versions` is a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
