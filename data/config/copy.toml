# data/config/copy.toml — TECH_PLAN.md §10.7
#
# EVERY player-facing string lives here, not in Python. This supersedes the
# feedback.py template table implied by §12 row 13: rejection wording, check
# labels, check blurbs and the primer are one data file, because they are the
# surface most worth tuning from playtesting and none of it should require a
# code change. `launder_core.gates.feedback` renders (code, params) against
# this file and HOLDS NO STRINGS ITSELF.
#
# COPY STANDARD, PRODUCT-WIDE: simplified technical English. Short sentences,
# one idea each, active voice, present tense, common words, and no metaphor a
# new player has to decode. Three rules, enforced in review:
#
#   1. ONE WORD, ONE MEANING. "Floor" once meant both the detector threshold
#      and the 50-word minimum, on the same screen. The threshold label is
#      "Under N to clear"; "floor" keeps the length minimum, alone.
#   2. NEVER CLAIM MORE THAN THE DETECTOR CAN SUPPORT. The detector finds a
#      watermark; it does not find an author. Absence of a watermark does not
#      prove a human wrote it, and presence of one does not prove which model
#      wrote it. The readout is "AI watermark detected" / "Not detected" —
#      never "human", never a "% AI" figure. The meter's 0-100 number is a
#      relabelled z, so it is never printed with a "%" and never called a
#      percentage or a probability. Nor is the watermark ever called SECURE:
#      the keys are published, which makes it real, not secure, and real is
#      the more interesting claim anyway (§14.4).
#   3. NAME THE FAILURE, NOT THE TAXONOMY. Rejection text is read by someone
#      who just lost; jargon reads as a shrug.
#
# Standing instructional text on the playing screen: <=12 words TOTAL. The
# slider intro teaches; prose does not. Explanatory prose is allowed only on
# demand, inside a sheet.
#
# TWO LINT RULES, run in CI and at boot (`forge lint-copy`):
#   1. Every check name in REGISTRY has a [check.<name>] block with all three of
#      label, blurb, reject. Adding a check to levels.toml without writing its
#      copy fails the build rather than shipping a constraint the player cannot
#      interrogate.
#   2. Every {placeholder} in a template resolves against that check's declared
#      params keys. A renamed param silently blanking a rejection message is
#      exactly the bug this catches.

schema = "launder.copy/1"

# ---------------------------------------------------------------------------
# The first-land sheet (§10.7). Wordle's contract exactly: opens once on first
# land, keyed on localStorage["launderwm.primer.v1"], and thereafter only from
# the `?` in the rail. ~60 words in three beats. It never explains the ripple —
# the mirror teaches that wordlessly and prose would spoil it.
# ---------------------------------------------------------------------------
[primer]
lede_1 = "This text is watermarked."
body_1 = "Watermarking makes language models choose words in a secret pattern. The text reads normally, but a detector that knows the pattern can find it."

# THE DEMO STRIP IS GENERATED, NEVER HAND-PAINTED. It runs the production
# contributions() over the real key, so the cold slots are cold because the
# POSITION had no options. A hand-authored stain would be the one surface in the
# product free to teach the false heuristic, so it is forbidden.
#
# CI ASSERTION on whatever sentence ships here (§10.7): at least one FUNCTION
# word must land in the top heat quartile and at least one CONTENT word must
# fall below the optionality cutoff. The reference sentence lands "The" and "on"
# at full heat and "met", "consider", "of" at zero. That is the §4.6 guardrail —
# the most banal words are the hottest — and the STRIP carries it alone: there
# is no caption under the demo restating it in words, because a sentence the
# player skims past teaches nothing the picture has not already shown, and it
# costs the sheet a beat. If a candidate demo sentence fails the assertion, it
# is the wrong sentence.
demo   = "The committee met on Thursday to consider whether the proposal deserved another year of funding."

lede_2 = "Your job: wash it out."
body_2 = "Move the needle below the line. Use as few word changes as you can. The text must still read well and mean the same."

open_label  = "What is this?"
close_label = "Start"

# ---------------------------------------------------------------------------
# The detector readout.
#
# The `{z_*_display}` placeholders keep their names because z is what the wire,
# the DB and the geometry carry — but what gets substituted into them is the
# 0-100 POINTS relabelling (§11). z is a statistic nobody can place and a scale
# that runs from -2 to 10 reads as broken. Points are a monotone renaming of
# the same number, so "under 36" and "z <= 2.3263" are the same sentence.
# ---------------------------------------------------------------------------
[readout]
above           = "AI watermark detected"   # the detector finds a watermark, not an author
below           = "Not detected"      # never "human" — the detector cannot support that claim
threshold_label = "Under {z_star_display} to clear"
meter_name      = "Watermark evidence"
# role="meter" needs a spoken value, not a number nobody can place.
valuetext_above = "{z_display}, above the line"
valuetext_below = "{z_display}, below the line"
distance_label  = "{distance} changed"
distance_zero   = "nothing changed"
cleared_toast   = "Cleared in {distance}"
provisional_note = "Gate unavailable — this one does not count."
share_template  = "Launder WM — level {level_n} cleared in {distance} 🧼"

# The end-of-campaign share (§12). `{per_level}` is every level's distance in
# level order, space-separated, in groups of five joined by " · " so fifteen
# numbers stay scannable in a timeline; a level with no recorded distance is a
# "-". `{total}` is their sum and `{url}` is `location.origin` at RUNTIME —
# hardcoding a domain here would post the wrong link from every preview deploy
# and from localhost.
share_all_template = "Launder WM 🧼\nCleared all {level_count} levels — {total} words changed\n{per_level}\n{url}"

# The playing screen. `action` is the only standing INSTRUCTION, and twelve
# words is the whole budget for that. Everything else here is furniture: where
# the player is in the campaign, the two states of the result sheet's forward
# button, and the two links in the footer. Furniture does not teach, so it does
# not spend the instruction budget — but it still has to be plain.
[screen]
action      = "Check"          # the action keeps one name through the whole flow
level_label = "Level {n} of {total}"   # {total} is always shown: 15 is the promise
next_label  = "Next level"
all_clear   = "That was the last level. You cleared every one."
credit      = "Made by @ShrivuShankar"
source      = "Source"
# The share box's button, and it is NOT optional furniture. `data-copy-opt`
# removes its element when this key is missing, which detached the one click
# handler that can copy a share — and on the last level, where the whole
# campaign's score is the only thing the game still has to give the player,
# the forward button is hidden too, so the sheet offered a four-line string
# and no way to take it anywhere. One verb, the same one every other app puts
# on this button.
copy_label  = "Copy"
# The four sheet dismiss buttons render a bare "×", which a screen reader
# announces as "multiplication sign". `data-copy-aria-opt` only sets the
# aria-label when the key exists, so without this the sheets close via a
# control that has no name at all.
close_label = "Close"

# ---------------------------------------------------------------------------
# One block per registered check name (§7.6 REGISTRY keys), NOT per level.
#
# LABELS are templated from CheckResult.params. BLURBS are static per check
# type: a blurb explains the KIND of constraint, so it must not embed a level's
# numbers — "you may change only this many words" reads correctly at every
# budget, and a blurb that hardcoded 12 would silently lie on the level tuned
# to 6.
# ---------------------------------------------------------------------------

[check.unicode_sanitation]
label  = "Real characters"
blurb  = "Every character has to be one a reader can see. Invisible spacers, hidden joiners, and letters from other alphabets that look like English ones do not count as edits — they change what the detector reads without changing what you read. Paste from a word processor and a few can arrive without you noticing."
reject = "This does not read like a person wrote it — {count} invisible or lookalike characters were added."
fix_label = "Clean it for me"
fix_note  = "This applies the same change as an ordinary edit. It costs ordinary distance."

[check.word_floor]
label  = "At least {min_words} words"
blurb  = "The text has to stay about this long. Deleting your way to a short passage is not laundering — a short text carries too little evidence for the detector either way, so the puzzle would solve itself."
reject = "Too short: {n_words} words, and this level needs {min_words}."

[check.edit_budget]
label  = "Budget {max_word_distance} words"
blurb  = "You may change only this many words. A changed word, a deleted word, an added word, and a pair of swapped words each count as one. Fewer is better on every level; here it is also the rule."
reject = "You changed {distance} words. This level allows {max_word_distance}."

[check.locked_phrase]
label  = "Verbatim phrase"
blurb  = "One phrase must stay exactly as it is — same words, same order, same punctuation. You are quoting a source, so you work around it. The phrase carries watermark signal you cannot touch, which is the point."
reject = "The phrase \"{phrase}\" is no longer in the text, exactly as written."

[check.close_paraphrase]
label  = "Close rewrite only"
blurb  = "This level wants surgery, not a rewrite. Keep most of the original's key words, keep the sentences roughly where they are, and keep the length close. Swapping the whole vocabulary lowers the reading, but it is not the skill this level is about."
reject = "Too free — this level wants surgery, not a rewrite ({content_word_retention_pct}% of key words kept, needs {min_content_word_retention_pct}%)."
reject_length = "Too far from the original's length ({length_ratio_pct}%, allowed {length_ratio_min_pct}–{length_ratio_max_pct}%)."
reject_sentences = "You restructured the sentences. This level allows a difference of {max_sentence_count_delta}."
# close_paraphrase can fail five ways and only three had copy, so a player who
# failed on DISTANCE or ALIGNMENT was shown the RETENTION message — quoting
# retention numbers that were fine. `forge lint-copy` reported "OK" because it
# checked the keys that exist, not the keys the check can ask for; it now
# checks the codes the check actually emits.
reject_distance = "Too many words changed for this level ({word_distance_ratio_pct}% of the passage, allowed {max_word_distance_ratio_pct}%)."
reject_alignment = "One of the original sentences has no counterpart left — this level wants them edited in place, not merged or split ({sentence_alignment_pct}% matched, needs {min_sentence_alignment_pct}%)."

[check.unit_test]
label  = "Tests pass"
blurb  = "The code still has to work. It runs against a fixed set of tests, and every one of them has to pass. Code is a terrible place to hide a watermark, because there is almost no room to say the same thing a different way — that is what this level is showing you."
reject = "Test failed: {test_name}."
reject_timeout = "The code did not finish in {timeout_ms} ms."

[check.edit_region]
label  = "Only the first {editable_prefix_words} words"
blurb  = "On this level you may only change the opening. That is more generous than it sounds: the detector reads each word in the context of the ones before it, so changing a word alters what it sees for everything that follows and nothing that came earlier. An edit near the start is worth more than the same edit near the end."
reject = "Word {first_bad_word_index} is outside the opening. On this level only the first {editable_prefix_words} words can change."

[check.detector_floor]
label  = "Not too clean"
blurb  = "There is a bottom to this level as well as a top. The reading is measured against ordinary writing, so a number far below the middle is as unusual as one far above it — text that avoids the pattern that hard looks like text written by someone who knew the pattern. Land inside the window; do not erase."
reject = "Too clean. The needle reads {z_display} and has to stay at or above {z_floor_display}."

[check.detector_threshold]
label  = "Under the line"
blurb  = "This is the win condition. The needle shows how much watermark evidence the detector finds. It has to sit at or below the line when you check. The reading you see while typing is the same one used here."
# {z_target_display} is the EFFECTIVE bar, `z_star + max_z`, not z* itself. On a
# level that tunes max_z the two differ, and naming z* told the player to reach
# a number that would still fail — self-contradictory whenever max_z < 0.
reject = "Still detected. The needle reads {z_display} and has to reach {z_target_display}."

[check.llm_gate]
label  = "Reads well, means the same"
blurb  = "A second model reads your text and reports what it sees: whether a person could read it, and whether it still says what the original said. It does not score style. Plainer, blunter, shorter and simpler all pass. It never takes instructions from your text."
# Generic fallback. The real message is chosen by code from reject_by_code.
reject = "This did not pass the reading check."

# One line per derived verdict code (§7.4). `claim_label` is AUTHORED OFFLINE,
# which is why feedback can name a dropped claim without ever quoting the
# player's own text back at them — both an injection surface and bad UX.
#
# `claim_label` is a NOUN PHRASE by construction ("the purpose of triage"), so
# every template here has to read with one substituted in. `meaning_inverted`
# used to say "the original says {claim_label}, yours doesn't", which needs a
# CLAUSE and rendered "the original says the purpose of triage, yours doesn't."
# across all 105 authored claims. It read as correct only while every passage
# shipped an empty claim list and the branch could never fire.
[check.llm_gate.reject_by_code]
meaning_drift     = "Meaning drifted — you dropped the claim about {claim_label}."
meaning_inverted  = "Meaning flipped — you reversed the claim about {claim_label}."
meaning_added     = "You added something the original never says: \"{added}\"."
injection_attempt = "Nice try. The judge reads your text, it doesn't take orders from it."

# `not_natural_language` splits on the observed kind.
[check.llm_gate.reject_by_unnatural_kind]
word_salad        = "That isn't readable prose — a human has to be able to read it."
keyword_soup      = "The words survived but the sentences didn't."
repetition        = "You're padding with repeated text."
non_prose_content = "There's something in here that isn't part of the writing."
not_english       = "This isn't readable English."

# ---------------------------------------------------------------------------
# Gate pips and the checklist sheet.
# ---------------------------------------------------------------------------
[gate]
pending_label   = "Not checked yet"
pass_label      = "Passed"
fail_label      = "Failed"
error_label     = "Could not check"
disclosure_hint = "Tap a rule to see what it means"
checklist_title = "This level's rules"

# ---------------------------------------------------------------------------
# Errors are specific and never apologize (§10.6).
# ---------------------------------------------------------------------------
[errors]
network        = "No connection. Your text is safe; try Check again."
rate_limited   = "Too many checks. Try again in {retry_after_s} seconds."
too_long       = "That text is too long to check."
# A 404 from submit or detect: the level this page is playing is not one the
# server knows about — a tab left open across a deploy, or a hand-typed
# `?level=`. Nothing rolls over and nothing is "running today"; the fix is a
# reload, so the copy says so.
unknown_passage = "That level is not on this server. Reload the page."
detector_offline = "The needle is reading from the server right now."
detector_mismatch = "This build's detector does not match this passage. Reading from the server instead."

# ---------------------------------------------------------------------------
# The intro (§10.7, CONCEPT.md "Intro"). Wordless where it can be.
# ---------------------------------------------------------------------------
[intro]
slider_label = "Length"
beat_1       = "More text, more evidence."
beat_2       = "You can't just delete your essay."
hand_off     = "Now wash one out."

# ---------------------------------------------------------------------------
# L6's mandatory on-screen disclosure (§6.5). One line, verbatim, always shown.
# Pre-generating the TEXT while running the REAL detector is categorically
# different from faking a detector, and saying so is what keeps a skeptical
# audience on side.
# ---------------------------------------------------------------------------
[disclosure]
l6_regen = "These four texts were generated ahead of time on the author's RTX 5090 — Railway has no GPU. The generation is real; the detector reading you're watching is live, right now, in your browser, with the same key that flagged every other level."
