# data/config/progression.toml — the campaign, in order.
#
# The game is a linear campaign, not a daily. There is no date arithmetic here,
# nothing rolls over at midnight, and the only ordering is `n`. Clear a level and
# you advance to the next; `?level=N` renders any level without touching
# progress, which is how the author tests it.
#
# WHY EIGHT AND NOT FIFTEEN. The campaign was fifteen levels drawn from four
# rulesets, and it was measured: on every one of them the only checks that ever
# decided an outcome were the detector threshold and the judge. The budgets
# (12 and 18) were two to six times what a greedy delete-the-hottest-word attack
# actually spent, `close_paraphrase` is satisfied trivially by a two-word edit,
# and both locked phrases sat in text the detector barely scores. Fifteen levels,
# one puzzle. Eight levels that each add a pressure the player can name is a
# better game than fifteen that do not.
#
# EVERY LEVEL BELOW ADDS EXACTLY ONE THING:
#   1  the loop and the ripple                    (free play, gentlest passage)
#   2  more text means more evidence              (free play, the z 7.33 wall)
#   3  count your edits                           (a budget that actually binds)
#   4  you may only edit the opening              (the ripple runs one way)
#   5  quote your source verbatim                 (and the quote is hot)
#   6  you cannot just say something else         (every claim survives)
#   7  too clean is also a tell                   (a window, not a direction)
#   8  everything at once, two words              (the finale)
#
# `overrides` merges over the ruleset's own params, because a budget is only a
# constraint when it is tuned to ITS passage — one number on a shared ruleset is
# no constraint at all on the easiest passage that uses it. Each number below is
# set from a VERIFIED solution for that passage, and set below what the greedy
# attack needs on it, so the bound admits skilled play and excludes the script.

schema = "launder.progression/1"

# A level whose passage file is missing, or whose `rules` id levels.toml does not
# define, is a BOOT FAILURE. A hole in a linear campaign is not a day to skip; it
# dead-ends the player halfway through.
strict = true

# --- act one: learn the instrument ------------------------------------------

# The gentlest passage in the set (z 3.95, a verified two-edit clear). Nothing to
# obey but the line itself, so the heat mirror and the rightward ripple are the
# only things to notice — which is the point.
[[level]]
n          = 1
passage_id = "p01"
rules      = "L1"

# The same rules against the highest reading in the campaign (z 7.33). Same
# instrument, four times the evidence to remove: this is where "longer text
# carries more evidence" stops being a sentence and becomes an experience. The
# word floor is what stops the obvious answer of deleting the essay.
[[level]]
n          = 2
passage_id = "p11"
rules      = "L1"

# --- act two: one constraint each -------------------------------------------

# The first binding budget. Greedy deletion needs 7 edits on this passage and the
# best verified solution is 6, so a budget of 6 admits the answer and excludes
# the brute force. Placement starts to matter here and nowhere earlier.
[[level]]
n          = 3
passage_id = "p10"
rules      = "L2"
overrides  = { edit_budget = { max_word_distance = 6 } }

# Edits confined to the opening. Because context runs left to right, an edit
# re-keys everything downstream of it and nothing upstream — so this constraint
# is generous rather than cruel, and it is the only level that makes the player
# find that out.
[[level]]
n          = 4
passage_id = "p03"
rules      = "L7"

# A phrase you must reproduce verbatim, chosen by its g-values rather than by how
# quotable it reads: it sits in the hottest run in the passage, so the signal you
# most want to disturb is the signal you are forbidden to touch. Budget tightened
# from the ruleset's 18 to 8 against a verified 6-edit clear.
[[level]]
n          = 5
passage_id = "p13"
rules      = "L3"
overrides  = { edit_budget = { max_word_distance = 8 } }

# The tight fence: every claim in the passage must survive, nothing may be added,
# and the shape has to stay close to the original. Paraphrasing your way out —
# the move that works on every earlier level — stops working here.
[[level]]
n          = 6
passage_id = "p15"
rules      = "L4"

# --- act three: hard ---------------------------------------------------------

# The reading must land in a window rather than merely under the line. Every
# automated attack on this game is a hill climb that minimises z; a floor turns
# that into a targeting problem and "delete until it goes quiet" stops being a
# strategy. Uses the passage with the lowest starting reading, so the window is
# narrow in edit terms.
[[level]]
n          = 7
passage_id = "p12"
rules      = "L8"

# The finale. Locked phrase, tight fence, the two-sided window, every claim, and
# two words to spend. A verified two-edit clear exists for this passage and the
# greedy attack needs five, which is exactly what makes the budget honest.
[[level]]
n          = 8
passage_id = "p14"
rules      = "L9"
