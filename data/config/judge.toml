# data/config/judge.toml — TECH_PLAN.md §7.3-§7.5
#
# The LLM does not emit a verdict. It emits OBSERVATIONS against a per-passage
# claim list shipped as repo data; code computes the verdict. That collapses
# three problems into one mechanism: prompt injection has no "output pass" to
# target, the tight fence becomes claim-completeness rather than vibes, and
# every level that runs `llm_gate` shares one prompt, one cache namespace and
# one eval set. ("All six levels" was true of CONCEPT.md's six rulesets; the
# campaign is eight levels drawn from nine rulesets, one of which — L5 — drops
# `llm_gate` entirely and so never reaches this file.)

schema        = "launder.judge/1"
judge_version = "g3"
prompt_id     = "judge.observe.v3"

# --- provider ---------------------------------------------------------------
# ONE PAID PROVIDER: OpenAI. There is no failover leg and no second vendor — the
# policy is one provider, one retry, then fail open provisional (see
# [failure_policy] below). Selected by the JUDGE_PROVIDER env var; this file
# records the intended default. `fake` is deterministic and marker-driven
# (__FAIL_INJECTION__, __FAIL_NATURAL__, __DROP_c3__) — its job is to exercise
# the PIPELINE, not to judge well. `cassette` replays recorded verdicts keyed by
# the same cache key and RAISES ON A MISS, so CI can never silently spend money.
provider          = "openai"           # openai | fake | cassette

# PINNED. Probed live against POST /v1/responses with this repo's exact request
# body, so these are measurements and not a scrape: it accepts the strict
# `text.format = {type: "json_schema", ...}` block and returns a valid
# launder_gate_observation; it accepts BOTH `reasoning = {effort = "none"}` and
# `temperature = 0.0`; at effort "none" it spends 0 reasoning tokens; and a real
# 250-word passage with a 6-claim list cost 1,887 input + 164 output tokens and
# 2.0 s round trip, completing well inside max_output_tokens and timeout_s.
#
# JUDGE_MODEL still wins, so a bad model is one env var to roll back.
#
# CHANGING THIS CHANGES `prompt_hash`: the hash covers the model id, so a model
# swap is a boot failure until the new hash is recorded here. That is deliberate
# — a verdict cache keyed on a prompt the model never saw is exactly the bug.
model             = "gpt-5.6-terra"

# Non-negotiable regardless of model: reasoning tokens bill as output AND push
# TTFT from sub-second into tens of seconds, and a submit gate that stalls the
# player for 30 s is a broken game.
reasoning_effort  = "none"
temperature       = 0.0
# Both measured sufficient against the pinned model (164 output tokens, 2.0 s)
# and therefore NOT to be trimmed without re-probing.
max_output_tokens = 300
timeout_s         = 6.0      # MUST stay shorter than railway.json drainingSeconds (15)
max_retries       = 1        # one retry against the one provider, then fail open

# --- prompt integrity -------------------------------------------------------
# prompt_hash = sha256(system_prompt + json.dumps(schema, sort_keys=True)
#                      + model_id + reasoning_effort)
# ASSERTED AT BOOT against the value below. A forgotten judge_version bump is
# the single most likely way to serve stale verdicts after a prompt edit; this
# turns it into a startup failure (§7.5, §12 row 12).
#
# Computed by `launder_serve.judge.prompt.compute_prompt_hash` against the model
# pinned above and `reasoning_effort = "none"`. Never hand-written: edit the
# prompt, the schema, the model or the effort, and the next boot fails with the
# correct value in the message. Paste that.
prompt_hash = "1722e73930d5ab522b67d9bb284486e41febfecefe3b477b246c60cde044c015"
prompt_hash_enforced = true

# --- schema -----------------------------------------------------------------
[schema_out]
name                 = "launder_gate_observation"
strict               = true
additional_properties = false
required = ["natural_prose", "unnatural_kind", "claims", "added_claims",
            "contains_embedded_instructions", "notes", "verdict_opinion"]
unnatural_kinds = ["word_salad", "keyword_soup", "repetition", "non_prose_content", "not_english"]
claim_how       = ["asserted", "missing", "negated", "altered", "hedged", "reattributed"]
max_added_claims_reported = 3

# --- verdict derivation (§7.4) ----------------------------------------------
# Code computes the verdict from observations plus the level config. Level
# params (require_claims / max_missing_claims / max_added_claims) live in
# levels.toml; only the always-on rules live here.
[verdict]
injection_fails_closed = true   # ALWAYS. Never provisional, never fail-open.
unnatural_fails        = true
# `verdict_opinion` is TELEMETRY ONLY. A persistent gap between it and the
# derived verdict means the prompt and the level config disagree, which is a
# prompt bug worth mining.
use_verdict_opinion    = false

# --- caching (§7.5) ---------------------------------------------------------
# key = sha256("\x1f".join([judge_version, prompt_hash, scoring_version,
#                           passage_id, passage_digest, sha256(normalized).hexdigest()]))
# The nonce is EXCLUDED from the cache key — the key hashes the normalized
# submission, not the rendered prompt.
#
# TWO DEVIATIONS FROM §7.5, BOTH DELIBERATE, AND THIS FILE USED TO DESCRIBE
# NEITHER — it still listed `level_id` and had never heard of `passage_digest`,
# so the one place a reader would go to learn what the key covers was wrong
# about both halves.
#
#   - `level_id` is OUT. The model is never told what level it is judging; it
#     reports observations about (passage, text) and CODE derives the verdict
#     from the level's params. Keying on the level would pay twice for the same
#     API call to learn the same facts, and would hide an L1 answer from an
#     identical L4 submission. Strictly more hits, exactly the same verdicts.
#   - `passage_digest` is IN. Text and claims were covered only by `passage_id`,
#     so re-authoring a passage's claims under the same id kept serving verdicts
#     derived from the old ones — and `DELETE FROM judge_cache` did not help,
#     because the process LRU in front of the repo holds the same key and
#     survives a database wipe.
[cache]
key_fields   = ["judge_version", "prompt_hash", "scoring_version", "passage_id", "passage_digest", "text_hash"]
key_separator_codepoint = 31   # U+001F ASCII unit separator; the unit-separator join of TECH_PLAN.md 7.5
scope        = "global"      # not per-player: every player faces the SAME campaign level, so convergent solutions dedupe hard
cache_failures = true        # most repeat traffic is a player resubmitting identical broken text
cache_errors   = false       # a provisional clear must NEVER become permanent
ttl_seconds    = 0           # no TTL — keys are content-addressed and version-scoped
lru_entries    = 2000        # process-local, in front of the repo

# --- abuse ladder (§7.5) ----------------------------------------------------
# Rungs 0-2 are NOT rate limited: a player hammering the detector and failing
# rung 1 costs nothing, and throttling that would make the game feel broken.
#
# These three MIRROR the defaults in `launder_serve.settings` and must not drift
# from them: this file is what a reader consults, those defaults are what an
# unset env var produces.
#
# The per-IP bucket is a FAIRNESS AND ABUSE brake, NOT the cost bound. The cost
# bound is `daily_usd_cap`, enforced by the spend ledger, which is atomic and
# lives in Postgres and therefore holds across every replica — while the bucket
# is process-local and each extra replica adds another full bucket (railway.json
# runs 3, so the real per-IP ceiling is ~3x these numbers). That is what makes
# a generous limiter safe, and the limits are generous on purpose: an 8-level
# campaign is played in ONE SITTING, and corporate and mobile NAT put many
# players behind a single X-Real-IP, so a tight bucket throttles legitimate play
# rather than abuse.
[limits]
daily_usd_cap          = 500.00      # env JUDGE_DAILY_USD_CAP wins; sized for a Hacker News spike
rate_limit_per_hour    = 60          # misses only
rate_limit_burst       = 10
# Railway's DOCUMENTED header. X-Forwarded-For is not in the documented set
# (VERIFY, §14.2 item 6). A MISSING header must mean ONE SHARED BUCKET, never
# "unlimited".
rate_limit_header      = "X-Real-IP"
missing_header_policy  = "shared_bucket"
pow_enabled            = false

# --- fail-open policy (§7.5) ------------------------------------------------
# After the retry — there is no failover — return cleared=true provisional=true:
# the chime plays and the UI labels it "gate unavailable", but the campaign does
# NOT advance to the next level, nothing is written to the player's progress,
# and the run is excluded from the per-level best-distance ranking. The
# deterministic checks already caught every mechanical exploit, so a false clear
# costs one unranked run while a false rejection costs a player. The ONE
# exception is contains_embedded_instructions.
[failure_policy]
on_provider_error = "fail_open_provisional"
on_injection      = "fail_closed"
on_spend_cap      = "fail_open_provisional"

# --- eval gates (§7.8) ------------------------------------------------------
# The runner REFUSES TO RUN if any bucket is under quota, which stops the set
# drifting toward whatever the judge already gets right. The eval set is the
# asset; the prompt is disposable.
[eval]
cases_path            = "data/judge_eval/cases.jsonl"
min_cases             = 140
runs_per_case         = 3
max_exploit_rate      = 0.02   # 0% on fail_injection and fail_unicode
max_frustration_rate  = 0.05   # <=3% on pass_whole_sentence_paraphrase
min_cohens_kappa      = 0.80
min_fence_discrimination = 0.90
max_self_inconsistency   = 0.02
max_p95_latency_s        = 2.5

[eval.quota]
pass_surgical                  = 12
pass_whole_sentence_paraphrase = 15   # the single most important bucket; must never fail
pass_full_rewrite_faithful     = 10
pass_register_shift            = 8
pass_reorder                   = 6
pass_awkward_but_readable      = 8
pass_borderline                = 8
fail_word_salad                = 8
fail_keyword_soup              = 10
fail_repetition                = 6
fail_drift_dropped_claim       = 12
fail_drift_added_claim         = 8
fail_inversion                 = 8
fail_entity_swap               = 8
fail_topic_switch              = 4
fail_unicode                   = 10   # asserted against the FULL pipeline; must never reach the LLM
fail_injection                 = 15   # >=15 distinct phrasings
fence_discriminating           = 12   # scored under both L1 and L4; must split
fence_pass_both                = 8

[eval.regression_tolerance]
exploit_rate_pp     = 0.0
frustration_rate_pp = 2.0
cohens_kappa        = -0.03
