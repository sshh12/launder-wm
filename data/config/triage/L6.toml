# data/config/triage/L6.toml — TECH_PLAN.md §6.5
#
# AUTHORING TIME ONLY. Unmeasured hypotheses; see L2.toml.
#
# L6 is "control the sampler". The passage is a LONG HIGH-ENTROPY WALL that
# hand-editing is meant to lose to: the level's payload is the contrast between
# a ~140-word regenerate (which clears, and scores ~140) and a 4-edit surgical
# kill on an earlier level. So L6 inverts the usual accept criteria — it wants
# the passage to be HARD by hand, not fair.
#
# The four variants are pre-generated by `forge regen` into
# data/regen/<id>.regen.json: wm_off, wm_other_key, wm_on_temp02 and
# wm_on_baseline (the level's own passage), each with gen_params, expected_z and
# a provenance receipt. The mandatory on-screen disclosure is in copy.toml
# [disclosure].l6_regen and is not optional.

[accept]
margin_z_min                     = 12.0        # a WALL: overwhelming evidence
n_scored_min                     = 260         # 120-word floor plus room above it
median_eff_choices_min           = 18.0        # high-entropy host, deliberately
hot_runs_min                     = 6           # many targets, none of them sufficient
upstream_leverage_min            = 1.20
# LOW concentration is the requirement here, not high: evidence must be spread
# so that no small set of edits kills it. This is the one level where a
# concentrated passage is a REJECT.
concentration_max                = 0.30
par_upper                        = { min = 12, max = 60 }
exhaustive_clear_free_upto_k_min = 2
retokenize_ok                    = true
judge_baseline_pass              = true
word_count                       = { min = 200, max = 400 }

[accept.regen]
# The control that makes the whole demo not-a-trick (§4.6 mechanism 5): same
# model, same prompt, same temperature, DIFFERENT KEY -> the detector reads
# clean. If wm_other_key does not read clean, the demo is claiming something the
# artifacts do not support and the candidate is rejected.
variants_required        = ["wm_on_baseline", "wm_off", "wm_other_key", "wm_on_temp02"]
wm_off_z_max             = 2.3263      # must read below the notch
wm_other_key_z_max       = 2.3263      # must read below the notch — the proof
wm_on_baseline_z_min     = 12.0
receipt_required         = true        # model, revision, dtype, torch version, GPU, timestamp, forge commit

[reject_reasons]
too_easy_by_hand   = "par_upper < 12 — a hand solve at this cost defeats the level's point"
too_concentrated   = "concentration > 0.30 — a surgical kill exists, so the wall is not a wall"
control_failed     = "wm_other_key or wm_off reads above the notch"
missing_receipt    = "a regen variant has no provenance receipt"
teaches_wrong_lesson = "upstream_leverage < 1.0"

[derive]
# No edit budget: L6 must permit the ~140-word regenerate submission, which is
# the level's payload. It clears, and it scores ~140, shown on the same scale as
# a 4-edit surgical kill. That contrast IS the level.
max_word_edits = "null"
