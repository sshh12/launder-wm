# .github/workflows/ci.yml — .build-docs/TECH_PLAN.md §11.6
#
# Three jobs: python | web | docker. Railway autodeploys with "Wait for CI", so
# the deployment sits in WAITING until these finish and becomes SKIPPED if any
# fail. Zero secrets live here: no RAILWAY_TOKEN, no deploy job to maintain,
# and JUDGE_PROVIDER=cassette throughout so CI can never spend money.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A cassette provider replays recorded verdicts keyed by the same cache key
  # and RAISES ON A MISS. That is the mechanism that makes "CI never spends
  # money" structural rather than a promise.
  JUDGE_PROVIDER: cassette
  UV_LOCKED: "1"

jobs:
  # ---------------------------------------------------------------------------
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launder_test
        # `-U postgres -d launder_test`, NOT a bare `pg_isready`. The health
        # command runs as root inside the container, and bare `pg_isready`
        # defaults the role to the invoking OS user — so every probe answered
        # `FATAL: role "root" does not exist`, the service never went healthy,
        # and the whole python job failed before its first step.
        #
        # It failed that way on every push for two commits and nobody noticed,
        # which is the more important half of this bug: the deployment went out
        # anyway. This workflow's own header says "Railway autodeploys with
        # 'Wait for CI', so the deployment sits in WAITING until these finish
        # and becomes SKIPPED if any fail" — production is currently serving a
        # commit whose CI was red, so that is not what the service does today.
        options: >-
          --health-cmd "pg_isready -U postgres -d launder_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      # READ BY packages/serve/tests/test_repo_contract.py, which parametrizes
      # the repository contract over memory | sqlite | POSTGRES. It used to be
      # read by nothing but the `alembic upgrade head` step below, so the
      # postgres:17 service proved that migrations apply and nothing else while
      # §11.6 claimed the contract suite ran against it.
      # Quoted: a plain YAML scalar cannot carry "://" plus a bare ":" — unquoted,
      # this made the whole workflow unparseable and every run failed in 0s with
      # "workflow file issue", which reports as a FAILING CI that never ran a test.
      TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/launder_test"
      TEST_SQLITE_URL: "sqlite+aiosqlite:///:memory:"
      # Turns a SKIPPED Postgres leg into a FAILURE here. A gate that can pass
      # by not running is not a gate.
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # .python-version is the single source of truth, read by forge, serve and CI.
      - run: uv python install

      # `--all-extras` cannot be used: launder-forge's `cpu` and `cuda` extras
      # are declared as conflicting (same torch pin, different index). CI takes
      # the CPU path explicitly.
      - name: sync (CPU torch path)
        run: uv sync --locked --extra cpu --dev

      - name: ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      # ONE INVOCATION PER PACKAGE. packages/serve/tests and
      # packages/forge/tests each hold a `conftest.py` and neither directory is
      # an importable package, so `mypy packages` dies with "Duplicate module
      # named conftest" before checking anything. See the Makefile.
      - name: mypy
        run: |
          uv run mypy packages/core
          uv run mypy packages/serve alembic
          uv run mypy packages/forge

      # THE PARITY GATE (§4.5) needs BOTH runtimes in one job. Without node and
      # web/node_modules here, `packages/forge/tests/test_parity_ts.py` skips —
      # and the single most important assertion in the repo would be green by
      # absence. Node is installed before pytest for exactly that reason.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install the browser detector's deps (for the parity gate)
        working-directory: web
        run: npm ci

      # Regenerating goldens must always be a reviewed diff, never a way to
      # turn a red test green. The committed CHECKSUM is what enforces that.
      - name: golden-vector checksums
        working-directory: data/golden
        run: sha256sum -c CHECKSUM

      # The hard invariant of §2.1. If torch, fastapi or anything else creeps
      # into launder-core's imports, this fails here rather than as a 4 GB
      # Railway image six weeks later.
      - name: bare-venv import of launder_core
        run: |
          uv run --isolated --no-project --python 3.12 \
            --with pydantic --with blake3 --with numpy \
            --with-editable packages/core \
            python -c "import launder_core, sys; print('bare core ok', launder_core.__version__); assert 'torch' not in sys.modules"

      - name: pytest
        run: uv run pytest -q --maxfail=1

      # Belt and braces: pytest's parity test SKIPS when node is absent, so
      # assert here that it did not. A gate that can pass by not running is not
      # a gate.
      - name: the parity gate actually ran
        run: uv run pytest -q -m golden packages/forge/tests/test_parity_ts.py -rs | tee /tmp/parity.txt
      - name: ... and skipped nothing
        run: |
          if grep -qi "skipped" /tmp/parity.txt; then
            echo "::error::the Python<->TypeScript parity gate skipped; see the reason above"
            cat /tmp/parity.txt; exit 1
          fi

      # THE §4.5 RECOMPUTATION, WHICH NOTHING HERE WAS RUNNING. pytest covers the
      # golden vectors (test_pipeline.py) and the TS parity gate (above), and
      # `sha256sum -c CHECKSUM` covers data/golden/ — but checks 1 and 5 of
      # `forge verify`, the blake3 of every shipped artifact in data/MANIFEST.json
      # and the re-derivation of every data/passages/*.public.json from the
      # committed assets, ran nowhere in CI. A hand-edited passage or an asset
      # swapped without `forge manifest --write` therefore reached Railway green.
      # It runs last because it is the slowest and because a failure here is most
      # readable once the cheaper checks have already spoken.
      #
      # `lint-copy` is next to it for the same reason: core's boot-time half is
      # covered by packages/core/tests/test_copy.py, but §10.7's other two rules
      # (the keys a check can ASK FOR, and the non-check sections' render
      # contexts) live in the forge CLI and were only ever run by hand.
      - name: forge lint-copy
        run: uv run python -m launder_forge.cli lint-copy
      - name: forge verify (recompute every checksum, cross-check the TS detector)
        run: uv run python -m launder_forge.cli verify

      - name: alembic upgrade head on a clean DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}

      # THE JUDGE EVAL SET (§7.8) IS NOT BUILT YET. There is no
      # `launder_serve.eval.judge` module and no `data/judge_eval/cases.jsonl`,
      # so this step could only ever fail. It is commented rather than deleted
      # because the plan is explicit that "the eval set IS the spec" and this is
      # where it runs; the Makefile targets are still there and still correct.
      # Uncomment the day the harness and the 140 labelled cases land.
      #
      # - name: judge eval against cassettes
      #   run: make eval-judge-fake

  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: tsc
        run: npx tsc --noEmit

      # vitest reads data/golden/vectors.json — THE SAME FILE pytest reads.
      - name: vitest
        run: npx vitest run

      - run: npm run build

      - name: packed blob round-trips
        run: node tools/pack-check.mjs

      # The TS half of the parity gate, run on its own so a failure localizes
      # to "the browser detector disagrees with the golden file" before the
      # python job's cross-language comparison even starts.
      - name: browser detector vs. the golden file
        run: npm run parity

      - name: slop-check
        run: npm run slop-check

      # THE MIRROR-ALIGNMENT HARNESS (§14.1 risk 4, "the FIRST thing in M2") and
      # the §10.3 mobile assertions. `@playwright/test` was not a dependency at
      # all, so `npm ci` did not install it, `playwright.config.ts` and both
      # e2e specs were orphaned files, and no CI job referenced them. It is a
      # devDependency now and this is where it runs.
      #
      # WHAT THIS CANNOT DO, stated because the config says it too: Android font
      # boosting and iOS focus-zoom are DEVICE failures. Emulated "Mobile
      # Safari" is desktop WebKit with a small viewport and a touch flag. This
      # catches CSS and layout regressions; it does not catch device bugs.
      - name: install the chromium engine
        run: npx playwright install --with-deps chromium
      - name: e2e (mirror alignment + the §10.3 mobile rules)
        run: npx playwright test --project=chromium --project=reduced-motion

      # ---- asset-size budget (§5.2). A build gate, not a warning. ----------
      # This turns the mobile-download constraint into a build failure instead
      # of an invoice: 50k uniques x 1.28 MB is ~$3.20 of egress, but the same
      # traffic against an unpacked 33 MB tokenizer.json is ~$82.50.
      #
      # `npm run size-gate` IS the gate — the same one the Dockerfile runs. This
      # step used to re-implement it inline, wrongly, in two directions at once:
      #
      #   * `stat -c%s dist/assets/gemma3-tok.*.bin.br` matched NOTHING (vite has
      #     `publicDir: false` and the blob is served by the Python app out of
      #     data/assets/), so under `set -euo pipefail` the step FAILED on every
      #     run — the `web` job was red as committed.
      #   * `find dist/assets -name 'index-*.css.br'` also matched nothing (vite
      #     emits `style-<hash>.css.br`), `cat` with no arguments read stdin, and
      #     the CSS budget evaluated to 0 — a gate that could never fail no
      #     matter how large the CSS grew.
      #
      # One implementation, run from both places, is the fix. tools/size-gate.mjs
      # measures data/assets for the blob and dist/ for everything else, and
      # brotli-compresses anything vite did not emit a sibling for, so a missing
      # sibling shows up as a size rather than as a free pass.
      - name: asset-size budget
        run: npm run size-gate

  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build the image Railway will build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: launder:ci
          # `/healthz` is railway.json's healthcheckPath, so its `sha` is the
          # deploy gate's identity — and it read "unknown" in production because
          # nothing ever put a commit in the image or the environment.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ... and the arg actually landed. An unused ARG is silently ignored by
      # docker, so "we pass --build-arg" is not evidence that anything reads it.
      - name: the image knows which commit it is
        run: |
          BAKED=$(docker run --rm --entrypoint sh launder:ci -c 'printenv GIT_SHA')
          echo "GIT_SHA in the image: ${BAKED:-<empty>}"
          test "$BAKED" = "${{ github.sha }}" || {
            echo "::error::the image reports GIT_SHA=${BAKED:-<empty>}, expected ${{ github.sha }};"\
                 "/healthz would answer \"unknown\" and could not tell one deploy from another"
            exit 1
          }

      - name: no .env in the image
        run: |
          if docker run --rm launder:ci sh -c 'ls -a /app | grep -qE "^\.env"'; then
            echo "::error::.env leaked into the image"; exit 1
          fi

      # If a torch string ever appears here, the image is ~8 GB and the
      # Dockerfile's `--package launder-serve` guarantee has been broken.
      #
      # LOOKS AT /app/.venv DIRECTLY. `pip list` reported the SYSTEM python's
      # packages, which is an empty list — the venv has no pip in it — so the
      # grep matched nothing whatever the venv contained. A gate that cannot see
      # the thing it is gating is decorative.
      - name: no torch in the venv
        run: |
          if docker run --rm --entrypoint sh launder:ci -c 'ls /app/.venv/lib/python3.12/site-packages' | grep -iE '^torch'; then
            echo "::error::torch is installed in the runtime image"; exit 1
          fi
          # ... and prove the gate was looking at a REAL venv, not an empty path.
          docker run --rm --entrypoint sh launder:ci -c \
            'ls -d /app/.venv/lib/python3.12/site-packages/launder_core-*.dist-info >/dev/null' \
            || { echo "::error::the venv the gate inspected does not contain launder_core"; exit 1; }

      - name: no answer keys in the image
        run: |
          if docker run --rm launder:ci sh -c 'ls /app/data/passages 2>/dev/null | grep -q "author.json"'; then
            echo "::error::*.author.json leaked into the image"; exit 1
          fi

      # ---- image size ------------------------------------------------------
      # MEASURED FROM INSIDE THE CONTAINER, not with `docker image inspect
      # --format '{{.Size}}'`. That field means DIFFERENT THINGS on different
      # daemons: with the containerd snapshotter (Docker Desktop 29.x) it is the
      # COMPRESSED content-store size, and with the classic overlay2 image store
      # (this runner) it is the uncompressed total. The same image reported
      # 135 MB on the author's box and ~584 MB here, so the gate silently
      # measured one number in development and another in CI — and the 135 MB
      # figure was recorded as "52% of the 250 MB budget" when the image had
      # never been under it. `du -sm /` is the same number everywhere.
      #
      # WHY THE CEILING IS NOT §2.3's 250 MB. The image is ~374 MB and the floor
      # is: numpy 71 (43 + 28 numpy.libs), the venv's precompiled bytecode 43,
      # python itself 37, sqlalchemy 23, psycopg[binary] 19, uvloop 16, hf_xet
      # 12, tokenizers 11, huggingface_hub 7, plus the Debian slim base. Every
      # one of those is load-bearing: core needs numpy, the server detector
      # needs tokenizers, and Railway needs psycopg. No vendor SDK is in that
      # list any more — the judge speaks raw REST over httpx, which is why
      # dropping the openai (20 MB) and anthropic (13 MB) packages cost nothing
      # but image size. Two stage-3 changes already took 76 MB out (the
      # runtime no longer ships the 52.5 MB uv binary it never invoked, and the
      # workspace install moved into the deps stage). Getting under 250 MB needs
      # a decision §2.3 has not made — dropping uvloop, switching to
      # psycopg[c] + libpq5, or stripping the bytecode and paying cold-start —
      # so this gate holds the line where the image actually is and the gap is
      # stated rather than hidden behind a field that reports 135 MB.
      - name: image size (uncompressed rootfs)
        run: |
          set -euo pipefail
          SIZE_MB=$(docker run --rm --entrypoint sh launder:ci -c 'du -sm / 2>/dev/null | tail -1 | cut -f1')
          echo "image rootfs: ${SIZE_MB} MB (ceiling 400 MB; TECH_PLAN §2.3 target 250 MB)"
          test "$SIZE_MB" -le 400 || { echo "::error::image over the 400 MB ceiling: ${SIZE_MB} MB"; exit 1; }
          if [ "$SIZE_MB" -gt 250 ]; then
            echo "::warning::image is ${SIZE_MB} MB, above TECH_PLAN §2.3's 250 MB target"
          fi
