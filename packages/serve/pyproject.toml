##
## launder-serve — FastAPI. Depends on launder-core only (TECH_PLAN.md §2.1).
##
## This is the ONLY package installed in the Railway image:
##   uv sync --locked --no-dev --package launder-serve
##
[project]
name = "launder-serve"
version = "0.1.0"
description = "Launder LM server: static hosting, /api/detect, /api/submit, the gate"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "launder-core",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16",
    # psycopg3, NOT asyncpg: accepts Railway's DATABASE_URL verbatim (sslmode=
    # and friends) and one driver serves both the async app and sync Alembic.
    "psycopg[binary,pool]>=3.2",
    "aiosqlite>=0.21",
    "pydantic-settings>=2.10",
    "openai>=2.0",
    "anthropic>=0.69",
    "httpx>=0.28",
    # THE SERVER TOKENIZER. /api/detect addresses tokens by character offset so
    # the browser needs none in SERVER mode (§9.2), and detector_threshold
    # recomputes the reading server-side (§7.1 row 7) — both need text -> ids.
    # §2.1's dependency table has no entry for this and that was a gap, not a
    # decision: the server cannot tokenize without one and /api/detect is a
    # shipped endpoint. `tokenizers` is the SAME Rust implementation the 4,031
    # golden vectors were generated from, which is why nothing here writes a
    # second BPE. ~3 MB in the image, no torch, no transformers.
    #
    # The floor is 0.22, not the plan's 0.23, for the reason recorded at length
    # in packages/forge/pyproject.toml: tokenizers 0.23.0 was never released and
    # transformers 5.15.0 (which forge pins) caps at <=0.23.0, so the workspace
    # venv can only resolve 0.22.x. Widening the floor here keeps serve and
    # forge on ONE tokenizer build — two would mean the server and the golden
    # generator could disagree, and no test would notice. The committed
    # data/golden/tokenizer_golden.json is the arbiter either way.
    "tokenizers>=0.22,<0.24",
    # The committed tokenizer blob is brotli-compressed (1,192,944 B vs
    # 3,634,910 B raw). Python has no stdlib brotli.
    "brotli>=1.1",
]

[project.scripts]
launder-serve = "launder_serve.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launder_serve"]
