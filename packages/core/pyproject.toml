##
## launder-core — pure Python. No torch, no FastAPI, no network.
##
## HARD INVARIANT (.build-docs/TECH_PLAN.md §2.1): `import launder_core` must
## succeed in a venv containing only the three dependencies below. CI enforces
## it with a bare-venv import test. This is what keeps torch out of the Railway
## image.
##
[project]
name = "launder-core"
version = "0.1.0"
description = "Launder WM core: watermark, detector, scoring, gates, schemas"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3",
    "blake3>=1.0",
    "numpy>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launder_core"]
