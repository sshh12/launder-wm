##
## launder-forge — LOCAL ONLY. Never installed on Railway. Never in the image.
## (.dockerignore excludes packages/forge/; the Dockerfile syncs
##  `--package launder-serve`, which is what actually keeps torch out.)
##
## TORCH, AND THE ONE DELIBERATE DEVIATION FROM TECH_PLAN.md §2.1 / §6.1
## ---------------------------------------------------------------------------
## The plan pins `torch==2.13.0` from the cu130 index, because cu128/cu129
## wheels were REMOVED in 2.13 and cu130 is the Blackwell (sm_120) path. That
## pin is correct for the RTX 5090 and is declared verbatim below, under the
## `cuda` extra, together with the `[[tool.uv.index]]` block the plan specifies.
##
## But CI has no GPU and must not download a ~3 GB CUDA wheel, so the version
## pin is ALSO expressed against the default index (PyPI, CPU wheels) under a
## `cpu` extra. The VERSION IS NOT DOWNGRADED in either path — both are
## `torch==2.13.0`; only the index differs. The two extras are declared as
## mutually exclusive in the workspace root's `[tool.uv] conflicts`.
##
##   uv sync --extra cuda     # the 5090 authoring box  ->  make forge-gpu
##   uv sync --extra cpu      # CI / any CPU checkout   ->  make forge-cpu
##
## A bare `uv sync` installs neither, so the workspace resolves everywhere and
## `forge doctor` fails with an actionable message instead of a silent wrong
## wheel. Never `uv pip install torch` ad hoc — the lockfile is the record.
##
[project]
name = "launder-forge"
version = "0.1.0"
description = "Launder LM authoring studio: generate, analyze, solve, triage, calibrate, pack"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "launder-core",
    "transformers==5.15.0",
    "accelerate>=1.12,<2",
    # Do NOT hard-pin the tokenizers patch — a wrong pin is the #1 cause of
    # TokenizerFast load failures.
    #
    # DEVIATION FROM TECH_PLAN.md §2.1, forced by upstream and verified by
    # execution: the plan asks for `tokenizers>=0.23,<0.24`, which does not
    # resolve. transformers 5.15.0 declares `tokenizers<=0.23.0,>=0.22.0`, and
    # tokenizers 0.23.0 WAS NEVER RELEASED — PyPI has 0.23.0rc0 and then
    # 0.23.1. So transformers 5.15.0's ceiling admits only 0.22.x. Widening the
    # floor to 0.22 is the minimum change that resolves, and it is exactly the
    # "do not hard-pin the patch" rule the plan states one line earlier.
    #
    # Consequence to know: data/golden/tokenizer_golden.json (4,031 cases) was
    # generated with Rust tokenizers 0.23.1. If 0.22.x disagrees on any case,
    # the golden gate fails loudly in CI, which is the correct outcome — the
    # committed golden file is the arbiter, never the installed version.
    "tokenizers>=0.22,<0.24",
    "huggingface_hub[hf_xet]>=1.3,<2",
    # `forge tok pack` compresses the blob at brotli quality 11 / lgwin 24 and
    # asserts the result is byte-identical to the committed asset. Without this
    # it shells out to node, which works but makes a Python build step depend on
    # a JS runtime; the node path stays as the fallback.
    "brotli>=1.1",
    "sentencepiece>=0.2.1",
    "safetensors>=0.6",
    "scipy>=1.14",
    "typer>=0.15",
    "rich>=13",
    "orjson>=3.10",
    "python-dotenv>=1.0",
    # data/config/prompts/*.yaml (§6.2, §12 row 21). Present transitively via
    # transformers/accelerate, but a config format the CLI READS is a direct
    # dependency, not a coincidence of the resolver.
    "pyyaml>=6",
]

[project.optional-dependencies]
# The plan's pin, on the Blackwell path. This is what the 5090 installs.
cuda = ["torch==2.13.0"]
# Same pin, default index (CPU wheels). CI and any non-CUDA checkout.
cpu = ["torch==2.13.0"]

[project.scripts]
forge = "launder_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launder_forge"]

# --- the plan's index declaration, verbatim (TECH_PLAN.md §6.1) --------------
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true                      # used ONLY for torch, not for jinja2 etc.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-cpu", extra = "cpu" },
]
